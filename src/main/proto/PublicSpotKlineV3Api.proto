// Vendored from https://github.com/mexcdevelop/websocket-proto at 0c9c4f35dd0fadc3a46a350e909a93379d81e811 (Apache-2.0); java_package changed.
// spot@public.kline.v3.api.pb@<symbol>@<interval>

syntax = "proto3";

option java_package = "net.osslabz.mexc.proto";
option optimize_for = SPEED;
option java_multiple_files = true;
option java_outer_classname = "PublicSpotKlineV3ApiProto";

message PublicSpotKlineV3Api {
  //K线周期(Min1,Min5,Min15,Min30,Min60,Hour4,Hour8,Day1,Week1,Month1)
  string interval = 1;
  // 窗口开始时间戳(秒时间戳)
  int64 windowStart = 2;
  // 开盘价
  string openingPrice = 3;
  // 收盘价
  string closingPrice = 4;
  // 最高价
  string highestPrice = 5;
  // 最低价
  string lowestPrice = 6;
  // 成交量
  string volume = 7;
  // 成交额
  string amount = 8;
  // 窗口结束时间戳(秒时间戳)
  int64 windowEnd = 9;
}